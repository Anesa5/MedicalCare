<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MedicalCare</title>
    <link rel="stylesheet" href="/css/common.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--lavender-color);
            padding: 30px 15px;
        }

        .auth-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 82, 0.08);
            max-width: 420px;
            width: 100%;
        }

        .auth-card h1 {
            font-size: 24px;
            color: var(--primary-dark-color);
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-card p.sub {
            text-align: center;
            color: var(--muted-color);
            margin-bottom: 25px;
        }

        .auth-card .form-group {
            margin-bottom: 18px;
        }

        .auth-card label {
            display: block;
            font-size: 13.6px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .auth-card input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            font-family: var(--font-family);
            font-size: 13.6px;
        }

        .auth-card input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .auth-card .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            margin-top: 10px;
        }

        .auth-card .link {
            text-align: center;
            margin-top: 20px;
            font-size: 13.6px;
            color: var(--muted-color);
        }

        .auth-card .link a {
            color: var(--primary-color);
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="sub">Login to book appointments</p>

            <form onsubmit="event.preventDefault(); alert('Login successful!'); window.location.href='index.html';">
                <div class="form-group">
                    <label>Email or Phone</label>
                    <input type="text" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <p class="link">Don't have an account? <a href="signup.html">Sign Up</a></p>
                <p class="link"><a href="register.html">Are you a doctor? Register here</a></p>
            </form>
        </div>
    </div>
</body>

</html>
